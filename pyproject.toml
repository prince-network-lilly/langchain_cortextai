[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexchain"
version = "1.0.0"
description = "LangChain-style framework for the Lilly Cortex AI API"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "light_client @ git+https://github.com/EliLillyCo/LRL_light_k8s_infra_app_client_python.git@bdf0e2cf27260862b1e5615929e176f62e83a4a4",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-mock", "pytest-asyncio", "flake8", "black", "isort", "mypy"]

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 120
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120