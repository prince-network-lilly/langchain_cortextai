site_name: CortexChain Documentation
site_description: LangChain-style framework for the Lilly Cortex AI API
site_url: https://prince-network-lilly.github.io/langchain_cortextai/
repo_url: https://github.com/prince-network-lilly/langchain_cortextai
repo_name: prince-network-lilly/langchain_cortextai

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Core Concepts:
      - LLM: concepts/llm.md
      - Chains: concepts/chains.md
      - Tools & Agents: concepts/agents.md
      - Graph: concepts/graph.md
  - API Reference:
      - Schema: api/schema.md
      - LLM: api/llm.md
      - Chains: api/chains.md
      - Tools: api/tools.md
      - Agents: api/agents.md
      - Graph: api/graph.md
      - Utils: api/utils.md
  - Examples:
      - Basic Usage: examples/basic.md
      - RAG Pipeline: examples/rag.md
      - Multi-Agent: examples/multi-agent.md
      - MLOps: examples/mlops.md
