name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with flake8
        run: |
          flake8 cortexchain/ --max-line-length=120 --ignore=E501,W503,E203

      - name: Type check with mypy
        run: |
          mypy cortexchain/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=cortexchain --cov-report=term-missing

      - name: Check package builds
        run: |
          pip install build
          python -m build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 "black==24.4.2" isort

      - name: Check formatting with black
        run: black --check --target-version py39 --line-length 120 cortexchain/ tests/

      - name: Check import ordering
        run: isort --check-only --profile black --line-length 120 cortexchain/ tests/

      - name: Lint
        run: flake8 cortexchain/ --max-line-length=120 --ignore=E501,W503,E203
